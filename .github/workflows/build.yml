name: Build Anti-Lag Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Initialize Android Project Structure
      run: |
        mkdir -p app/src/main/java/com/antilag/app
        mkdir -p app/src/main/jniLibs/arm64-v8a

    - name: Copy Native Library (.so)
      run: |
        if [ -f "libkk.so" ]; then
          cp libkk.so app/src/main/jniLibs/arm64-v8a/libkk.so
          echo "Thành công: Đã sao chép libkk.so vào jniLibs"
        else
          echo "Lỗi: Không tìm thấy file libkk.so ở thư mục gốc!"
          exit 1
        fi

    - name: Create Root build.gradle
      run: |
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.5.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

    - name: Create settings.gradle
      run: |
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AntiLagProject"
        include ':app'
        EOF

    - name: Create App build.gradle
      run: |
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.antilag.app'
            compileSdk 34

            defaultConfig {
                applicationId "com.antilag.app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        EOF

    - name: Create AndroidManifest.xml
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com">

            <uses-permission android:android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="Anti Lag Service"
                android:theme="@android:style/Theme.NoDisplay">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".AntiLagService"
                    android:enabled="true"
                    android:exported="false"
                    android:foregroundServiceType="specialUse" />
            </application>
        </manifest>
        EOF

    - name: Create AntiLagService.java
      run: |
        cat << 'EOF' > app/src/main/java/com/antilag/app/AntiLagService.java
        package com.antilag.app;

        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.Service;
        import android.content.Intent;
        import android.os.Build;
        import android.os.IBinder;
        import androidx.core.app.NotificationCompat;

        public class AntiLagService extends Service {
            private static final String CHANNEL_ID = "AntiLagChannel";

            static {
                System.loadLibrary("kk");
            }

            public native void kichHoatChongLag();

            @Override
            public void onCreate() {
                super.onCreate();
                taoNotificationChannel();
                Notification notification = new Notification.Builder(this, CHANNEL_ID)
                        .setContentTitle("Anti-Lag Active")
                        .setContentText("Dịch vụ chống lag đang chạy ngầm...")
                        .build();
                
                startForeground(1, notification);

                // Khởi chạy luồng lặp vô hạn gọi JNI hàm gốc
                new Thread(new Runnable() {
                    @Override
                    public void run() {
                        while (true) {
                            try {
                                kichHoatChongLag();
                                Thread.sleep(5000);
                            } catch (InterruptedException e) {
                                e.printStackTrace();
                            }
                        }
                    }
                }).start();
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
                return START_STICKY;
            }

            @Override
            public IBinder onBind(Intent intent) {
                return null;
            }

            private void taoNotificationChannel() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel serviceChannel = new NotificationChannel(
                            CHANNEL_ID,
                            "Anti Lag Foreground Service Channel",
                            NotificationManager.IMPORTANCE_DEFAULT
                    );
                    NotificationManager manager = getSystemService(NotificationManager.class);
                    if (manager != null) {
                        manager.createNotificationChannel(serviceChannel);
                    }
                }
            }
        }
        EOF

    - name: Create MainActivity.java
      run: |
        cat << 'EOF' > app/src/main/java/com/antilag/app/MainActivity.java
        package com.antilag.app;

        import android.app.Activity;
        import android.content.Intent;
        import android.os.Bundle;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(mainActivity);
                
                // Khởi chạy Foreground Service
                Intent serviceIntent = new Intent(this, AntiLagService.class);
                startForegroundService(serviceIntent);
                
                // Kết thúc Activity ngay lập tức để ẩn giao diện hoàn toàn (Theme.NoDisplay)
                finish();
            }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AntiLag-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
